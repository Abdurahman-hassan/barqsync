[package]
name = "barqsync"
version = "0.4.1"
edition = "2024"
rust-version = "1.92"
description = "A parallel, rsync-compatible file synchronizer: local, over ssh, TLS-over-TCP streams or QUIC (macOS and Linux)"
license = "MIT OR Apache-2.0"
authors = ["Abdelrahman Hassan Hamdy"]
repository = "https://github.com/Abdurahman-hassan/barqsync"
readme = "README.md"
keywords = ["rsync", "sync", "backup", "file-transfer", "quic"]
categories = ["command-line-utilities", "filesystem", "network-programming"]
exclude = ["bench/results/*", "docs/*", ".gitignore", ".github/", "dist-workspace.toml"]

# `cargo binstall barqsync`: the archives the release workflow (dist) attaches to each
# GitHub Release.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.tar.gz"
bin-dir = "{ name }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[dependencies]
anyhow = "1.0.104"
blake3 = "1.8.7"
clap = { version = "4.6.7", features = ["derive", "env"] }
crossbeam-channel = "0.5.17"
ctrlc = "3.5.2"
dashmap = "6.2.1"
fastcdc = "5.0.0"
jwalk = "0.9.0"
libc = "0.2.190"
memmap2 = "0.9.11"
postcard = { version = "1.1.3", features = ["use-std"] }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls", "ring"] }
rayon = "1.12.0"
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "ring"] }
rkyv = "0.8"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
shlex = "2.0.1"
tokio = { version = "1.53.3", default-features = false, features = ["rt-multi-thread", "net", "io-util", "sync", "time"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
tokio-util = { version = "0.7.20", default-features = false, features = ["io", "io-util"] }
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }
zstd = "0.14.2"

[target.'cfg(target_os = "linux")'.dependencies]
io-uring = "0.7"

[dev-dependencies]
proptest = "1.12.0"
tempfile = "3.27.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.bench]
inherits = "release"
debug = true
strip = false

# The profile that 'dist' builds release binaries with (same as release: fat LTO)
[profile.dist]
inherits = "release"
