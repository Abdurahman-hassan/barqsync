<svg xmlns="http://www.w3.org/2000/svg" width="760" height="378" viewBox="0 0 760 378" role="img" aria-labelledby="t d"><title id="t">Only the changed parts travel</title><desc id="d">Step 1 hashes 64 KiB blocks; step 2 finds the two that differ; step 3 hashes those two in 4 KiB pieces; step 4 sends only the two changed pieces: 8 KiB instead of 128 KiB.</desc><style>text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}.f-bg{fill:#fcfcfb}.k-bg{stroke:#fcfcfb}.f-ring{fill:rgba(11,11,11,0.10)}.k-ring{stroke:rgba(11,11,11,0.10)}.f-ink{fill:#0b0b0b}.k-ink{stroke:#0b0b0b}.f-ink2{fill:#52514e}.k-ink2{stroke:#52514e}.f-muted{fill:#898781}.k-muted{stroke:#898781}.f-grid{fill:#e1e0d9}.k-grid{stroke:#e1e0d9}.f-base{fill:#c3c2b7}.k-base{stroke:#c3c2b7}.f-s1{fill:#2a78d6}.k-s1{stroke:#2a78d6}.f-s2{fill:#eb6834}.k-s2{stroke:#eb6834}.f-s1soft{fill:#b7d3f6}.k-s1soft{stroke:#b7d3f6}.f-onfill{fill:#ffffff}.k-onfill{stroke:#ffffff}@media (prefers-color-scheme:dark){.f-bg{fill:#1a1a19}.k-bg{stroke:#1a1a19}.f-ring{fill:rgba(255,255,255,0.10)}.k-ring{stroke:rgba(255,255,255,0.10)}.f-ink{fill:#f0efec}.k-ink{stroke:#f0efec}.f-ink2{fill:#c3c2b7}.k-ink2{stroke:#c3c2b7}.f-muted{fill:#898781}.k-muted{stroke:#898781}.f-grid{fill:#2c2c2a}.k-grid{stroke:#2c2c2a}.f-base{fill:#383835}.k-base{stroke:#383835}.f-s1{fill:#3987e5}.k-s1{stroke:#3987e5}.f-s2{fill:#d95926}.k-s2{stroke:#d95926}.f-s1soft{fill:#184f95}.k-s1soft{stroke:#184f95}.f-onfill{fill:#ffffff}.k-onfill{stroke:#ffffff}}</style><rect x="0.5" y="0.5" width="759" height="377" rx="12" class="f-bg k-ring"/><text x="24.0" y="36.0" font-size="17" font-weight="600" text-anchor="start" class="f-ink">Only the changed parts travel</text><text x="24.0" y="58.0" font-size="13" font-weight="400" text-anchor="start" class="f-ink2">Updating a file the other side already has an older copy of (a database, an image, a log).</text><text x="24.0" y="99.0" font-size="13" font-weight="600" text-anchor="start" class="f-ink">1  Coarse check</text><text x="24.0" y="115.0" font-size="12" font-weight="400" text-anchor="start" class="f-muted">one hash per 64 KiB</text><rect x="184.0" y="84.0" width="50.0" height="26.0" rx="4" class="f-base"/><rect x="236.0" y="84.0" width="50.0" height="26.0" rx="4" class="f-base"/><rect x="288.0" y="84.0" width="50.0" height="26.0" rx="4" class="f-base"/><rect x="340.0" y="84.0" width="50.0" height="26.0" rx="4" class="f-base"/><rect x="392.0" y="84.0" width="50.0" height="26.0" rx="4" class="f-base"/><rect x="444.0" y="84.0" width="50.0" height="26.0" rx="4" class="f-base"/><rect x="496.0" y="84.0" width="50.0" height="26.0" rx="4" class="f-base"/><rect x="548.0" y="84.0" width="50.0" height="26.0" rx="4" class="f-base"/><text x="610.0" y="101.0" font-size="12" font-weight="400" text-anchor="start" class="f-ink2">small: ~0.1 MB</text><text x="610.0" y="116.0" font-size="12" font-weight="400" text-anchor="start" class="f-ink2">per 256 MiB</text><text x="24.0" y="151.0" font-size="13" font-weight="600" text-anchor="start" class="f-ink">2  Compare</text><text x="24.0" y="167.0" font-size="12" font-weight="400" text-anchor="start" class="f-muted">6 blocks match, 2 differ</text><rect x="184.0" y="136.0" width="50.0" height="26.0" rx="4" class="f-base"/><rect x="236.0" y="136.0" width="50.0" height="26.0" rx="4" class="f-base"/><rect x="288.0" y="136.0" width="50.0" height="26.0" rx="4" class="f-s1soft"/><text x="313.0" y="153.0" font-size="11" font-weight="400" text-anchor="middle" class="f-ink">differs</text><rect x="340.0" y="136.0" width="50.0" height="26.0" rx="4" class="f-base"/><rect x="392.0" y="136.0" width="50.0" height="26.0" rx="4" class="f-base"/><rect x="444.0" y="136.0" width="50.0" height="26.0" rx="4" class="f-base"/><rect x="496.0" y="136.0" width="50.0" height="26.0" rx="4" class="f-s1soft"/><text x="521.0" y="153.0" font-size="11" font-weight="400" text-anchor="middle" class="f-ink">differs</text><rect x="548.0" y="136.0" width="50.0" height="26.0" rx="4" class="f-base"/><text x="24.0" y="203.0" font-size="13" font-weight="600" text-anchor="start" class="f-ink">3  Look closer</text><text x="24.0" y="219.0" font-size="12" font-weight="400" text-anchor="start" class="f-muted">only where it differs: 4 KiB</text><line x1="288.0" y1="162" x2="184.0" y2="188" class="k-grid" stroke-width="1"/><line x1="338.0" y1="162" x2="286.0" y2="188" class="k-grid" stroke-width="1"/><rect x="184.0" y="188.0" width="5.4" height="26.0" rx="2" class="f-base"/><rect x="190.4" y="188.0" width="5.4" height="26.0" rx="2" class="f-base"/><rect x="196.9" y="188.0" width="5.4" height="26.0" rx="2" class="f-base"/><rect x="203.3" y="188.0" width="5.4" height="26.0" rx="2" class="f-base"/><rect x="209.8" y="188.0" width="5.4" height="26.0" rx="2" class="f-base"/><rect x="216.2" y="188.0" width="5.4" height="26.0" rx="2" class="f-s1"/><rect x="222.6" y="188.0" width="5.4" height="26.0" rx="2" class="f-base"/><rect x="229.1" y="188.0" width="5.4" height="26.0" rx="2" class="f-base"/><rect x="235.5" y="188.0" width="5.4" height="26.0" rx="2" class="f-base"/><rect x="241.9" y="188.0" width="5.4" height="26.0" rx="2" class="f-base"/><rect x="248.4" y="188.0" width="5.4" height="26.0" rx="2" class="f-base"/><rect x="254.8" y="188.0" width="5.4" height="26.0" rx="2" class="f-base"/><rect x="261.2" y="188.0" width="5.4" height="26.0" rx="2" class="f-base"/><rect x="267.7" y="188.0" width="5.4" height="26.0" rx="2" class="f-base"/><rect x="274.1" y="188.0" width="5.4" height="26.0" rx="2" class="f-base"/><rect x="280.6" y="188.0" width="5.4" height="26.0" rx="2" class="f-base"/><line x1="496.0" y1="162" x2="392.0" y2="188" class="k-grid" stroke-width="1"/><line x1="546.0" y1="162" x2="494.0" y2="188" class="k-grid" stroke-width="1"/><rect x="392.0" y="188.0" width="5.4" height="26.0" rx="2" class="f-base"/><rect x="398.4" y="188.0" width="5.4" height="26.0" rx="2" class="f-base"/><rect x="404.9" y="188.0" width="5.4" height="26.0" rx="2" class="f-base"/><rect x="411.3" y="188.0" width="5.4" height="26.0" rx="2" class="f-base"/><rect x="417.8" y="188.0" width="5.4" height="26.0" rx="2" class="f-base"/><rect x="424.2" y="188.0" width="5.4" height="26.0" rx="2" class="f-base"/><rect x="430.6" y="188.0" width="5.4" height="26.0" rx="2" class="f-base"/><rect x="437.1" y="188.0" width="5.4" height="26.0" rx="2" class="f-base"/><rect x="443.5" y="188.0" width="5.4" height="26.0" rx="2" class="f-base"/><rect x="449.9" y="188.0" width="5.4" height="26.0" rx="2" class="f-base"/><rect x="456.4" y="188.0" width="5.4" height="26.0" rx="2" class="f-base"/><rect x="462.8" y="188.0" width="5.4" height="26.0" rx="2" class="f-s1"/><rect x="469.2" y="188.0" width="5.4" height="26.0" rx="2" class="f-base"/><rect x="475.7" y="188.0" width="5.4" height="26.0" rx="2" class="f-base"/><rect x="482.1" y="188.0" width="5.4" height="26.0" rx="2" class="f-base"/><rect x="488.6" y="188.0" width="5.4" height="26.0" rx="2" class="f-base"/><text x="24.0" y="255.0" font-size="13" font-weight="600" text-anchor="start" class="f-ink">4  Send</text><text x="24.0" y="271.0" font-size="12" font-weight="400" text-anchor="start" class="f-muted">just the changed pieces</text><rect x="184.0" y="240.0" width="50.0" height="26.0" rx="4" class="f-base"/><rect x="236.0" y="240.0" width="50.0" height="26.0" rx="4" class="f-base"/><rect x="288.0" y="240.0" width="50.0" height="26.0" rx="4" class="f-base"/><rect x="340.0" y="240.0" width="50.0" height="26.0" rx="4" class="f-base"/><rect x="392.0" y="240.0" width="50.0" height="26.0" rx="4" class="f-base"/><rect x="444.0" y="240.0" width="50.0" height="26.0" rx="4" class="f-base"/><rect x="496.0" y="240.0" width="50.0" height="26.0" rx="4" class="f-base"/><rect x="548.0" y="240.0" width="50.0" height="26.0" rx="4" class="f-base"/><rect x="302.7" y="240.0" width="5.0" height="26.0" rx="1.5" class="f-s1"/><rect x="529.4" y="240.0" width="5.0" height="26.0" rx="1.5" class="f-s1"/><text x="610.0" y="251.0" font-size="12" font-weight="600" text-anchor="start" class="f-ink">8 KiB sent,</text><text x="610.0" y="266.0" font-size="12" font-weight="600" text-anchor="start" class="f-ink">not 128 KiB</text><rect x="24.0" y="291.0" width="12.0" height="12.0" rx="3" class="f-base"/><text x="42.0" y="301.0" font-size="13" font-weight="400" text-anchor="start" class="f-ink2">already on the receiver, not sent</text><rect x="300.0" y="291.0" width="12.0" height="12.0" rx="3" class="f-s1soft"/><text x="318.0" y="301.0" font-size="13" font-weight="400" text-anchor="start" class="f-ink2">needs a closer look</text><rect x="475.8" y="291.0" width="12.0" height="12.0" rx="3" class="f-s1"/><text x="493.8" y="301.0" font-size="13" font-weight="400" text-anchor="start" class="f-ink2">sent</text><text x="24.0" y="330.0" font-size="12.5" font-weight="400" text-anchor="start" class="f-ink2">Over a network, an appended log or a rewritten file skips step 3: no extra cost.</text><text x="24.0" y="350.0" font-size="12.5" font-weight="400" text-anchor="start" class="f-ink2">Inserted or deleted bytes are found too: chunk boundaries follow the content.</text></svg>
