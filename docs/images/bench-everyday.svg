<svg xmlns="http://www.w3.org/2000/svg" width="760" height="382" viewBox="0 0 760 382" role="img" aria-labelledby="t d"><title id="t">Everyday syncs: barqsync vs rsync</title><desc id="d">Copy 200,000 small files: barqsync 20.5 s, rsync 42.4 s; Re-sync 500,000 files, 3 changed: barqsync 3.49 s, rsync 18.2 s; Update a 10 GiB file, 50 MiB changed: barqsync 5.9 s, rsync 24.3 s; Push 200,000 small files over ssh: barqsync 19.3 s, rsync 42.4 s; Re-sync 500,000 files over ssh: barqsync 3.26 s, rsync 12.9 s</desc><style>text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}.f-bg{fill:#fcfcfb}.k-bg{stroke:#fcfcfb}.f-ring{fill:rgba(11,11,11,0.10)}.k-ring{stroke:rgba(11,11,11,0.10)}.f-ink{fill:#0b0b0b}.k-ink{stroke:#0b0b0b}.f-ink2{fill:#52514e}.k-ink2{stroke:#52514e}.f-muted{fill:#898781}.k-muted{stroke:#898781}.f-grid{fill:#e1e0d9}.k-grid{stroke:#e1e0d9}.f-base{fill:#c3c2b7}.k-base{stroke:#c3c2b7}.f-s1{fill:#2a78d6}.k-s1{stroke:#2a78d6}.f-s2{fill:#eb6834}.k-s2{stroke:#eb6834}.f-s1soft{fill:#b7d3f6}.k-s1soft{stroke:#b7d3f6}.f-onfill{fill:#ffffff}.k-onfill{stroke:#ffffff}@media (prefers-color-scheme:dark){.f-bg{fill:#1a1a19}.k-bg{stroke:#1a1a19}.f-ring{fill:rgba(255,255,255,0.10)}.k-ring{stroke:rgba(255,255,255,0.10)}.f-ink{fill:#f0efec}.k-ink{stroke:#f0efec}.f-ink2{fill:#c3c2b7}.k-ink2{stroke:#c3c2b7}.f-muted{fill:#898781}.k-muted{stroke:#898781}.f-grid{fill:#2c2c2a}.k-grid{stroke:#2c2c2a}.f-base{fill:#383835}.k-base{stroke:#383835}.f-s1{fill:#3987e5}.k-s1{stroke:#3987e5}.f-s2{fill:#d95926}.k-s2{stroke:#d95926}.f-s1soft{fill:#184f95}.k-s1soft{stroke:#184f95}.f-onfill{fill:#ffffff}.k-onfill{stroke:#ffffff}}</style><rect x="0.5" y="0.5" width="759" height="381" rx="12" class="f-bg k-ring"/><text x="24.0" y="36.0" font-size="17" font-weight="600" text-anchor="start" class="f-ink">Everyday syncs: barqsync vs rsync</text><text x="24.0" y="58.0" font-size="13" font-weight="400" text-anchor="start" class="f-ink2">Seconds, lower is better · M-series Mac, APFS, rsync 3