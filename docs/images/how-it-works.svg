<svg xmlns="http://www.w3.org/2000/svg" width="760" height="426" viewBox="0 0 760 426" role="img" aria-labelledby="t d"><title id="t">How barqsync gets the same work done sooner</title><desc id="d">rsync scans, compares and copies one file after another in one thread; barqsync runs the same tasks on four lanes at once and finishes first.</desc><style>text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}.f-bg{fill:#fcfcfb}.k-bg{stroke:#fcfcfb}.f-ring{fill:rgba(11,11,11,0.10)}.k-ring{stroke:rgba(11,11,11,0.10)}.f-ink{fill:#0b0b0b}.k-ink{stroke:#0b0b0b}.f-ink2{fill:#52514e}.k-ink2{stroke:#52514e}.f-muted{fill:#898781}.k-muted{stroke:#898781}.f-grid{fill:#e1e0d9}.k-grid{stroke:#e1e0d9}.f-base{fill:#c3c2b7}.k-base{stroke:#c3c2b7}.f-s1{fill:#2a78d6}.k-s1{stroke:#2a78d6}.f-s2{fill:#eb6834}.k-s2{stroke:#eb6834}.f-s1soft{fill:#b7d3f6}.k-s1soft{stroke:#b7d3f6}.f-onfill{fill:#ffffff}.k-onfill{stroke:#ffffff}@media (prefers-color-scheme:dark){.f-bg{fill:#1a1a19}.k-bg{stroke:#1a1a19}.f-ring{fill:rgba(255,255,255,0.10)}.k-ring{stroke:rgba(255,255,255,0.10)}.f-ink{fill:#f0efec}.k-ink{stroke:#f0efec}.f-ink2{fill:#c3c2b7}.k-ink2{stroke:#c3c2b7}.f-muted{fill:#898781}.k-muted{stroke:#898781}.f-grid{fill:#2c2c2a}.k-grid{stroke:#2c2c2a}.f-base{fill:#383835}.k-base{stroke:#383835}.f-s1{fill:#3987e5}.k-s1{stroke:#3987e5}.f-s2{fill:#d95926}.k-s2{stroke:#d95926}.f-s1soft{fill:#184f95}.k-s1soft{stroke:#184f95}.f-onfill{fill:#ffffff}.k-onfill{stroke:#ffffff}}</style><rect x="0.5" y="0.5" width="759" height="425" rx="12" class="f-bg k-ring"/><text x="24.0" y="36.0" font-size="17" font-weight="600" text-anchor="start" class="f-ink">How barqsync gets the same work done sooner</text><text x="24.0" y="58.0" font-size="13" font-weight="400" text-anchor="start" class="f-ink2">Copying a directory tree: rsync works through it one file at a time; barqsync uses every core.</text><text x="24.0" y="113.0" font-size="14" font-weight="600" text-anchor="start" class="f-ink">rsync</text><text x="24.0" y="130.0" font-size="12" font-weight="400" text-anchor="start" class="f-muted">1 thread</text><rect x="150.0" y="96.0" width="52.0" height="28.0" rx="4" class="f-base"/><text x="176.0" y="114.0" font-size="11" font-weight="400" text-anchor="middle" class="f-ink">scan</text><rect x="204.0" y="96.0" width="52.0" height="28.0" rx="4" class="f-base"/><text x="230.0" y="114.0" font-size="11" font-weight="400" text-anchor="middle" class="f-ink">compare</text><rect x="258.0" y="96.0" width="52.0" height="28.0" rx="4" class="f-base"/><text x="284.0" y="114.0" font-size="11" font-weight="400" text-anchor="middle" class="f-ink">file 1</text><rect x="312.0" y="96.0" width="52.0" height="28.0" rx="4" class="f-base"/><text x="338.0" y="114.0" font-size="11" font-weight="400" text-anchor="middle" class="f-ink">file 2</text><rect x="366.0" y="96.0" width="52.0" height="28.0" rx="4" class="f-base"/><text x="392.0" y="114.0" font-size="11" font-weight="400" text-anchor="middle" class="f-ink">file 3</text><rect x="420.0" y="96.0" width="52.0" height="28.0" rx="4" class="f-base"/><text x="446.0" y="114.0" font-size="11" font-weight="400" text-anchor="middle" class="f-ink">file 4</text><rect x="474.0" y="96.0" width="52.0" height="28.0" rx="4" class="f-base"/><text x="500.0" y="114.0" font-size="11" font-weight="400" text-anchor="middle" class="f-ink">file 5</text><rect x="528.0" y="96.0" width="52.0" height="28.0" rx="4" class="f-base"/><text x="554.0" y="114.0" font-size="11" font-weight="400" text-anchor="middle" class="f-ink">file 6</text><rect x="582.0" y="96.0" width="52.0" height="28.0" rx="4" class="f-base"/><text x="608.0" y="114.0" font-size="11" font-weight="400" text-anchor="middle" class="f-ink">file 7</text><rect x="636.0" y="96.0" width="52.0" height="28.0" rx="4" class="f-base"/><text x="662.0" y="114.0" font-size="11" font-weight="400" text-anchor="middle" class="f-ink">file 8</text><text x="24.0" y="173.0" font-size="14" font-weight="600" text-anchor="start" class="f-ink">barqsync</text><text x="24.0" y="190.0" font-size="12" font-weight="400" text-anchor="start" class="f-muted">all cores</text><rect x="150.0" y="156.0" width="52.0" height="28.0" rx="4" class="f-s1"/><text x="176.0" y="174.0" font-size="11" font-weight="400" text-anchor="middle" class="f-onfill">scan A</text><rect x="204.0" y="156.0" width="52.0" height="28.0" rx="4" class="f-s1"/><text x="230.0" y="174.0" font-size="11" font-weight="400" text-anchor="middle" class="f-onfill">file 1</text><rect x="258.0" y="156.0" width="52.0" height="28.0" rx="4" class="f-s1"/><text x="284.0" y="174.0" font-size="11" font-weight="400" text-anchor="middle" class="f-onfill">file 5</text><rect x="150.0" y="188.0" width="52.0" height="28.0" rx="4" class="f-s1"/><text x="176.0" y="206.0" font-size="11" font-weight="400" text-anchor="middle" class="f-onfill">scan B</text><rect x="204.0" y="188.0" width="52.0" height="28.0" rx="4" class="f-s1"/><text x="230.0" y="206.0" font-size="11" font-weight="400" text-anchor="middle" class="f-onfill">file 2</text><rect x="258.0" y="188.0" width="52.0" height="28.0" rx="4" class="f-s1"/><text x="284.0" y="206.0" font-size="11" font-weight="400" text-anchor="middle" class="f-onfill">file 6</text><rect x="150.0" y="220.0" width="52.0" height="28.0" rx="4" class="f-s1"/><text x="176.0" y="238.0" font-size="11" font-weight="400" text-anchor="middle" class="f-onfill">compare</text><rect x="204.0" y="220.0" width="52.0" height="28.0" rx="4" class="f-s1"/><text x="230.0" y="238.0" font-size="11" font-weight="400" text-anchor="middle" class="f-onfill">file 3</text><rect x="258.0" y="220.0" width="52.0" height="28.0" rx="4" class="f-s1"/><text x="284.0" y="238.0" font-size="11" font-weight="400" text-anchor="middle" class="f-onfill">file 7</text><rect x="150.0" y="252.0" width="52.0" height="28.0" rx="4" class="f-s1"/><text x="176.0" y="270.0" font-size="11" font-weight="400" text-anchor="middle" class="f-onfill">file 4</text><rect x="204.0" y="252.0" width="52.0" height="28.0" rx="4" class="f-s1"/><text x="230.0" y="270.0" font-size="11" font-weight="400" text-anchor="middle" class="f-onfill">clone</text><rect x="258.0" y="252.0" width="52.0" height="28.0" rx="4" class="f-s1"/><text x="284.0" y="270.0" font-size="11" font-weight="400" text-anchor="middle" class="f-onfill">file 8</text><line x1="150" y1="298" x2="698" y2="298" class="k-base" stroke-width="1"/><text x="702.0" y="302.0" font-size="11" font-weight="400" text-anchor="start" class="f-muted">time</text><line x1="310" y1="293" x2="310" y2="303" class="k-ink" stroke-width="1.5"/><text x="310.0" y="318.0" font-size="12" font-weight="400" text-anchor="middle" class="f-ink2">barqsync done</text><line x1="688" y1="293" x2="688" y2="303" class="k-ink" stroke-width="1.5"/><text x="688.0" y="318.0" font-size="12" font-weight="400" text-anchor="middle" class="f-ink2">rsync done</text><rect x="24.0" y="341.0" width="8.0" height="8.0" rx="2" class="f-s1"/><text x="40.0" y="350.0" font-size="12.5" font-weight="400" text-anchor="start" class="f-ink2">Scan: one task per directory, in parallel; files are compared as listings arrive.</text><rect x="24.0" y="363.0" width="8.0" height="8.0" rx="2" class="f-s1"/><text x="40.0" y="372.0" font-size="12.5" font-weight="400" text-anchor="start" class="f-ink2">Copy: many files at once; big files are cloned (APFS, XFS, Btrfs) or copied in the kernel.</text><rect x="24.0" y="385.0" width="8.0" height="8.0" rx="2" class="f-s1"/><text x="40.0" y="394.0" font-size="12.5" font-weight="400" text-anchor="start" class="f-ink2">Network: listings and requests are pipelined, so data flows before the scan ends.</text></svg>
